name: build-richard

# Compila la imagen de Outline con la integración de Richard (panel de chat)
# y la publica en GHCR para que Portainer la levante.

on:
  push:
    branches:
      - richard-ai
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base (instala dependencias y compila la app)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/outline-base:ai
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build imagen final
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/outline:ai3
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/outline-base:ai
